<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iCab - Notifications</title>
    <meta
      name="description"
      content="iCab Notifications — Stay updated with your rides and account."
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="assets/js/config.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css?v=14" />
    <link rel="stylesheet" href="assets/css/notifications.css" />
  </head>

  <body
    class="bg-zinc-50 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-100 transition duration-300 pt-20 flex flex-col min-h-screen"
  >
    <!-- Shared Header -->
    <div id="header-container"></div>

    <!-- Notifications Body -->
    <main class="p-6 md:p-8 bg-zinc-50 dark:bg-zinc-950 flex-1">
      <div class="max-w-4xl mx-auto">
        <!-- Page Header -->
        <div
          class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8"
        >
          <div>
            <h1
              class="text-3xl font-black tracking-tight text-zinc-900 dark:text-white"
            >
              Notifications
            </h1>
            <p class="text-zinc-500 dark:text-zinc-400 font-medium">
              Keep track of your ride updates and profile alerts.
            </p>
          </div>
          <div class="flex items-center gap-3">
            <button
              onclick="markAllRead()"
              class="px-4 py-2 rounded-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-sm font-bold text-zinc-600 dark:text-zinc-400 hover:bg-zinc-50 dark:hover:bg-zinc-800 transition shadow-sm"
            >
              ✅ Mark all read
            </button>
            <button
              onclick="clearAllNotifications()"
              class="px-4 py-2 rounded-xl bg-red-50 dark:bg-red-900/10 text-sm font-bold text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/20 transition"
            >
              🗑️ Clear all
            </button>
          </div>
        </div>

        <!-- Filters -->
        <div
          class="flex items-center gap-2 mb-6 overflow-x-auto pb-2 scrollbar-hide"
        >
          <button
            onclick="filterNotifs('all')"
            id="filter-all"
            class="notif-filter-btn active"
          >
            All
          </button>
          <button
            onclick="filterNotifs('ride')"
            id="filter-ride"
            class="notif-filter-btn"
          >
            🚕 Rides
          </button>
          <button
            onclick="filterNotifs('wallet')"
            id="filter-wallet"
            class="notif-filter-btn"
          >
            💳 Wallet
          </button>
          <button
            onclick="filterNotifs('promo')"
            id="filter-promo"
            class="notif-filter-btn"
          >
            🎁 Offers
          </button>
          <button
            onclick="filterNotifs('system')"
            id="filter-system"
            class="notif-filter-btn"
          >
            📢 System
          </button>
        </div>

        <!-- Notifications List -->
        <div id="fullNotifList" class="space-y-4">
          <!-- Items injected here -->
          <div class="animate-pulse space-y-4">
            <div
              class="h-24 bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-100 dark:border-zinc-800"
            ></div>
            <div
              class="h-24 bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-100 dark:border-zinc-800"
            ></div>
            <div
              class="h-24 bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-100 dark:border-zinc-800"
            ></div>
          </div>
        </div>

        <!-- Empty State (Hidden) -->
        <div id="emptyNotif" class="hidden py-20 text-center">
          <div class="text-6xl mb-6">🔕</div>
          <h2 class="text-2xl font-black text-zinc-900 dark:text-white mb-2">
            No notifications yet
          </h2>
          <p
            class="text-zinc-500 dark:text-zinc-400 font-medium max-w-sm mx-auto"
          >
            Stay tuned! We'll notify you here when your next ride is confirmed
            or a promo code is available.
          </p>
          <button
            onclick="goToRoleDashboard()"
            class="mt-8 px-8 py-3 bg-yellow-400 hover:bg-yellow-500 text-black font-black rounded-xl transition shadow-xl shadow-yellow-400/20"
          >
            Go to Dashboard
          </button>
        </div>
      </div>
    </main>

    <!-- Shared Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js?v=12"></script>
    <script src="assets/js/main.js?v=12"></script>
    <script src="assets/js/loader.js?v=12"></script>
    <script src="assets/js/notifications.js?v=12"></script>
  </body>
</html>
