<!-- Shared Header — used on ALL pages -->
<header
  class="fixed top-0 left-0 right-0 z-50 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md shadow-sm border-b border-zinc-100 dark:border-zinc-800">
  <nav class="flex justify-between items-center px-4 md:px-12 py-3 md:py-4">
    <!-- Logo + Brand -->
    <div onclick="goHome()" class="group flex items-center gap-2 md:gap-3 cursor-pointer select-none">
      <img src="assets/logos/logo.png" alt="iCab Taxi"
        class="h-8 md:h-11 w-auto object-contain transition duration-300 group-hover:scale-105" />
      <span class="relative text-xl md:text-3xl font-extrabold tracking-tight">
        <span
          class="bg-gradient-to-r from-yellow-500 via-yellow-400 to-yellow-600 bg-clip-text text-transparent">i</span><span
          class="text-zinc-900 dark:text-white">Cab</span>
      </span>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2">
      <!-- User Name (Desktop only) -->
      <div id="headerUserName" class="hidden md:block text-sm font-medium text-zinc-500 dark:text-zinc-400 mr-2"></div>

      <!-- Notifications Bell -->
      <div class="relative" id="notifBellContainer" style="display: none">
        <button type="button" onclick="toggleNotifications(event)" id="notifBellBtn"
          class="px-3 py-2 rounded-xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition relative flex items-center justify-center"
          title="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-5 h-5 md:w-6 md:h-6 text-zinc-600 dark:text-zinc-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span id="notifCount"
            class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 border-2 border-white dark:border-zinc-900 rounded-full hidden"></span>
        </button>

        <!-- Notification Dropdown -->
        <div id="notifDropdown" class="icab-notif-dropdown">
          <div class="px-4 py-3 border-b border-zinc-100 dark:border-zinc-800 flex justify-between items-center">
            <h3 class="font-bold text-zinc-800 dark:text-white">
              Notifications
            </h3>
            <div class="flex items-center gap-2">
              <button type="button" id="trayMarkReadBtn" onclick="markAllRead()"
                class="text-xs font-bold text-yellow-600 hover:text-yellow-700">
                Mark all read
              </button>
              <span class="text-zinc-300 dark:text-zinc-700">|</span>
              <button type="button" id="trayClearBtn" onclick="clearAllNotifications()"
                class="text-xs font-bold text-red-500 hover:text-red-600">
                Clear
              </button>
            </div>
          </div>
          <div id="notifTray" class="max-h-[380px] overflow-y-auto">
            <!-- Items injected here -->
            <div class="p-8 text-center text-zinc-400 text-sm">Loading...</div>
          </div>
          <a href="notifications.html"
            class="block py-3 text-center text-xs font-bold text-zinc-500 dark:text-zinc-400 border-t border-zinc-100 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition">VIEW
            ALL NOTIFICATIONS</a>
        </div>
      </div>

      <!-- Menu -->
      <div class="relative">
        <button type="button" onclick="toggleDropdown(event)"
          class="px-4 py-2 rounded-xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition flex items-center gap-2 font-semibold text-zinc-700 dark:text-zinc-200"
          id="dropdownBtn">
          <span>Menu</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
            stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div id="icabDropdown" class="icab-dropdown">
          <div id="dropdownContent"></div>
        </div>
      </div>
    </div>
  </nav>
</header>
</body>
