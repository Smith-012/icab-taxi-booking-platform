<!-- Hero Section -->
<section
  id="hero"
  class="flex flex-col md:flex-row items-center justify-between px-6 md:px-20 py-10 md:py-16 bg-gradient-to-br from-yellow-100 via-white to-amber-100 dark:bg-none dark:bg-zinc-950"
>
  <!-- Left Text -->
  <div class="md:w-1/2 space-y-6">
    <div
      class="inline-block px-4 py-1 bg-yellow-300 dark:bg-yellow-900/30 text-yellow-800 dark:text-yellow-400 rounded-full text-sm font-semibold"
    >
      🚀 Now available in your city
    </div>
    <h1 class="text-4xl md:text-6xl font-extrabold leading-tight">
      Book a Ride <br />
      <span
        class="bg-gradient-to-r from-yellow-500 to-yellow-400 bg-clip-text text-transparent"
        >Anytime, Anywhere</span
      >
    </h1>
    <p class="text-lg text-zinc-600 dark:text-zinc-300">
      Fast, safe and affordable rides at your fingertips. Verified drivers,
      real-time tracking.
    </p>
    <div class="flex flex-col sm:flex-row gap-4">
      <button
        onclick="handleBookRideClick()"
        class="px-8 py-4 bg-yellow-400 hover:bg-yellow-500 text-black font-bold rounded-xl text-lg transition duration-200 shadow-lg hover:shadow-yellow-300/40"
      >
        Book a Ride
      </button>
      <button
        onclick="openDriverRegister()"
        class="px-8 py-4 border-2 border-zinc-300 dark:border-zinc-700 hover:border-yellow-400 dark:hover:border-yellow-400 rounded-xl text-lg font-semibold transition duration-200"
      >
        Become a Driver
      </button>
    </div>
  </div>

  <!-- Right Image -->
  <div class="md:w-1/2 mt-12 md:mt-0 flex justify-center">
    <img
      src="https://images.unsplash.com/photo-1556122071-e404eaedb77f?w=600&q=80"
      alt="iCab Taxi"
      class="rounded-3xl shadow-2xl w-full max-w-md object-cover hover:scale-105 transition duration-500"
    />
  </div>
</section>
