  </div>

  <!-- Menu -->
  <nav class="flex-1 p-4 space-y-2">

      <span class="whitespace-nowrap">Home</span>

    <button
      class="sidebar-item flex items-center gap-3 w-full"
      data-href="index.html#book-ride"

    <button

    >
      <span class="text-xl">📖</span>
      <span class="whitespace-nowrap">Ride History</span>

    <button
      class="sidebar-item flex items-center gap-3 w-full"

    >
      <span class="text-xl">💳</span>

    <button
      class="sidebar-item flex items-center gap-3 w-full"
      data-href="profile.html"
    >
      <span class="text-xl">👤</span>
      <span class="whitespace-nowrap">Profile</span>
    </button>
  </nav>

  <!-- Bottom Controls (Mobile) -->
  <div class="md:hidden p-4 border-t border-gray-700 space-y-3">

      onclick="toggleTheme()"

    <button
      onclick="logoutUser()"

      Logout
